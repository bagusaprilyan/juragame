<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memory Match - Cyber Glow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1020;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #00f2fe 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .level-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #e2e8f0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-icon:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: #00f2fe;
      transform: translateY(-2px);
    }

    .btn-icon:active {
      transform: scale(0.92);
    }

    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(16, 24, 48, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 16px;
      padding: 10px 8px;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .score-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .score-val {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    #score { color: #00f2fe; }
    #best-score { color: #f59e0b; }
    #timer { color: #a855f7; }
    #moves { color: #38bdf8; }

    .grid-container {
      width: 100%;
      max-width: 480px;
      display: grid;
      gap: 10px;
      perspective: 1000px;
      margin: 4px 0;
    }

    .card {
      position: relative;
      aspect-ratio: 1;
      cursor: pointer;
      border-radius: 14px;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
      user-select: none;
    }

    .card:focus-visible {
      box-shadow: 0 0 0 3px #00f2fe;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .card-back {
      background: linear-gradient(145deg, #16203c, #10172e);
      border: 1px solid rgba(139, 92, 246, 0.35);
      position: relative;
      overflow: hidden;
    }

    .card-back::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 8px;
      border: 1px dashed rgba(0, 242, 254, 0.2);
    }

    .card-back .back-icon {
      font-size: 1.25rem;
      opacity: 0.4;
      color: #8b5cf6;
    }

    .card-front {
      background: linear-gradient(145deg, #1b274c, #141c38);
      border: 1.5px solid #00f2fe;
      transform: rotateY(180deg);
      font-size: 2rem;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.25);
    }

    .card.matched .card-front {
      border-color: #10b981;
      background: linear-gradient(145deg, #143534, #0f2425);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
      animation: pulseMatch 0.4s ease-out;
    }

    @keyframes pulseMatch {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .footer-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-pill {
      background: linear-gradient(135deg, #8b5cf6, #00f2fe);
      border: none;
      color: #0b1020;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
      transition: all 0.2s ease;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
    }

    .btn-pill:active {
      transform: scale(0.96);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 16, 32, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: linear-gradient(145deg, #151e38, #0e1429);
      border: 1px solid rgba(0, 242, 254, 0.4);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(139, 92, 246, 0.25);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3.2rem;
      line-height: 1;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #00f2fe, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-stats {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }

    .modal-row strong {
      color: #f8fafc;
    }

    @media (max-width: 420px) {
      .app-container {
        padding: 10px;
        gap: 10px;
      }
      h1 { font-size: 1.25rem; }
      .grid-container { gap: 6px; }
      .card-front { font-size: 1.65rem; }
      .card { border-radius: 10px; }
      .card-face { border-radius: 10px; }
      .scoreboard { padding: 8px 4px; }
      .score-val { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="app-container">
    <header>
      <div class="title-group">
        <h1>EMOJI MEMORY</h1>
        <span class="level-badge" id="level-badge">Level 1 • Grid 4x4</span>
      </div>
      <div class="header-controls">
        <button class="btn-icon" id="btn-sound" title="Toggle Suara" aria-label="Toggle Suara">🔊</button>
        <button class="btn-icon" id="btn-restart" title="Ulang Permainan" aria-label="Ulang Permainan">↺</button>
      </div>
    </header>

    <div class="scoreboard">
      <div class="score-item">
        <span class="score-label">Skor</span>
        <span class="score-val" id="score">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Langkah</span>
        <span class="score-val" id="moves">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Waktu</span>
        <span class="score-val" id="timer">00:00</span>
      </div>
      <div class="score-item">
        <span class="score-label">Terbaik</span>
        <span class="score-val" id="best-score">0</span>
      </div>
    </div>

    <main class="grid-container" id="grid"></main>

    <div class="footer-bar">
      <button class="btn-pill" id="btn-main-action">
        <span id="btn-action-text">Mulai Ulang</span>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon" id="modal-icon">🎉</div>
      <h2 class="modal-title" id="modal-title">Level Selesai!</h2>
      <div class="modal-stats" id="modal-stats"></div>
      <button class="btn-pill" id="modal-btn">Lanjut Level</button>
    </div>
  </div>

  <script>
    const EMOJI_POOL = [
      '🦊', '🐼', '🦁', '🐸', '🦄', '🐙', '🦋', '🦉',
      '🚀', '🪐', '🍕', '🍩', '💎', '🔮', '🎮', '⚡',
      '🌈', '🎯', '🔥', '🍀', '🥑', '🍓', '🧩', '🏆',
      '🏀', '🎨', '🎸', '🍦', '🍒', '🍉', '🚗', '🎭'
    ];

    const LEVELS = [
      { level: 1, cols: 4, rows: 4, name: 'Level 1 • Grid 4x4' },
      { level: 2, cols: 4, rows: 5, name: 'Level 2 • Grid 4x5' },
      { level: 3, cols: 4, rows: 6, name: 'Level 3 • Grid 4x6' },
      { level: 4, cols: 6, rows: 6, name: 'Level 4 • Grid 6x6' }
    ];

    let currentLevelIndex = 0;
    let moves = 0;
    let score = 0;
    let totalScore = 0;
    let bestScore = parseInt(localStorage.getItem('memory_best_score') || '0', 10);
    let matchedPairs = 0;
    let totalPairs = 0;
    let flippedCards = [];
    let isLocked = false;
    let gameActive = false;
    let startTime = null;
    let elapsedTime = 0;
    let soundMuted = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.08) {
      if (soundMuted || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundFlip() {
      playTone(520, 'sine', 0.08, 0.06);
    }

    function soundMatch() {
      playTone(523.25, 'triangle', 0.12, 0.08);
      setTimeout(() => playTone(659.25, 'triangle', 0.14, 0.08), 70);
      setTimeout(() => playTone(783.99, 'triangle', 0.22, 0.09), 140);
    }

    function soundMismatch() {
      playTone(280, 'sawtooth', 0.12, 0.04);
      setTimeout(() => playTone(220, 'sawtooth', 0.16, 0.04), 90);
    }

    function soundWin() {
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'sine', 0.25, 0.08), idx * 100);
      });
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let confetti = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.6;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random() * 0.4 + 0.1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.fillStyle = `rgba(0, 242, 254, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }

    function spawnConfetti(originX, originY) {
      const colors = ['#00f2fe', '#8b5cf6', '#a855f7', '#38bdf8', '#10b981', '#f59e0b'];
      for (let i = 0; i < 35; i++) {
        confetti.push({
          x: originX,
          y: originY,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.8) * 8,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.2
        });
      }
    }

    function animationLoop(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.2;
        c.alpha -= 0.016;
        c.rot += c.vrot;

        if (c.alpha <= 0) {
          confetti.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.globalAlpha = Math.max(0, c.alpha);
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
        ctx.restore();
      }

      if (gameActive && startTime) {
        elapsedTime = Math.floor((performance.now() - startTime) / 1000);
        updateTimerDisplay();
      }

      requestAnimationFrame(animationLoop);
    }
    requestAnimationFrame(animationLoop);

    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('best-score');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const levelBadgeEl = document.getElementById('level-badge');
    const modalEl = document.getElementById('modal');
    const modalTitleEl = document.getElementById('modal-title');
    const modalIconEl = document.getElementById('modal-icon');
    const modalStatsEl = document.getElementById('modal-stats');
    const modalBtnEl = document.getElementById('modal-btn');
    const soundBtnEl = document.getElementById('btn-sound');
    const restartBtnEl = document.getElementById('btn-restart');
    const mainActionBtnEl = document.getElementById('btn-main-action');

    bestScoreEl.textContent = bestScore;

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      timerEl.textContent = formatTime(elapsedTime);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initLevel(lvlIndex, resetTotalScore = false) {
      currentLevelIndex = lvlIndex;
      const cfg = LEVELS[currentLevelIndex];
      levelBadgeEl.textContent = cfg.name;

      if (resetTotalScore) {
        totalScore = 0;
      }
      moves = 0;
      score = totalScore;
      matchedPairs = 0;
      flippedCards = [];
      isLocked = false;
      gameActive = false;
      startTime = null;
      elapsedTime = 0;

      scoreEl.textContent = score;
      movesEl.textContent = moves;
      updateTimerDisplay();
      modalEl.classList.remove('active');

      const totalCards = cfg.cols * cfg.rows;
      totalPairs = totalCards / 2;

      gridEl.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
      gridEl.innerHTML = '';

      const shuffledEmojis = shuffle(EMOJI_POOL);
      const chosenEmojis = shuffledEmojis.slice(0, totalPairs);
      const cardValues = shuffle([...chosenEmojis, ...chosenEmojis]);

      cardValues.forEach((val, idx) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Kartu ${idx + 1}`);
        card.dataset.value = val;
        card.dataset.index = idx;

        const innerFront = document.createElement('div');
        innerFront.classList.add('card-face', 'card-front');
        innerFront.textContent = val;

        const innerBack = document.createElement('div');
        innerBack.classList.add('card-face', 'card-back');
        const iconSpan = document.createElement('span');
        iconSpan.classList.add('back-icon');
        iconSpan.textContent = '✦';
        innerBack.appendChild(iconSpan);

        card.appendChild(innerBack);
        card.appendChild(innerFront);

        card.addEventListener('click', () => handleCardAction(card));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleCardAction(card);
          }
        });

        gridEl.appendChild(card);
      });
    }

    function handleCardAction(card) {
      if (isLocked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      if (!gameActive) {
        gameActive = true;
        startTime = performance.now() - (elapsedTime * 1000);
      }

      card.classList.add('flipped');
      soundFlip();
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [card1, card2] = flippedCards;
      const match = card1.dataset.value === card2.dataset.value;

      if (match) {
        setTimeout(() => {
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedPairs++;

          const rect1 = card1.getBoundingClientRect();
          const rect2 = card2.getBoundingClientRect();
          spawnConfetti(rect1.left + rect1.width / 2, rect1.top + rect1.height / 2);
          spawnConfetti(rect2.left + rect2.width / 2, rect2.top + rect2.height / 2);

          soundMatch();

          const pairScore = Math.max(50, 150 - Math.floor(elapsedTime / 2));
          score += pairScore;
          scoreEl.textContent = score;

          flippedCards = [];
          isLocked = false;

          if (matchedPairs === totalPairs) {
            handleLevelComplete();
          }
        }, 320);
      } else {
        setTimeout(() => {
          soundMismatch();
        }, 400);

        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isLocked = false;
        }, 900);
      }
    }

    function handleLevelComplete() {
      gameActive = false;
      soundWin();

      const timeBonus = Math.max(0, 300 - elapsedTime * 5);
      const movesBonus = Math.max(0, (totalPairs * 3 - moves) * 15);
      const levelBonus = (currentLevelIndex + 1) * 200;
      const roundTotal = timeBonus + movesBonus + levelBonus;
      score += roundTotal;
      totalScore = score;
      scoreEl.textContent = score;

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('memory_best_score', bestScore);
        bestScoreEl.textContent = bestScore;
      }

      spawnConfetti(window.innerWidth / 2, window.innerHeight / 2);

      const isLastLevel = currentLevelIndex >= LEVELS.length - 1;

      setTimeout(() => {
        modalIconEl.textContent = isLastLevel ? '👑' : '🎉';
        modalTitleEl.textContent = isLastLevel ? 'Juara Selesai!' : 'Level Selesai!';

        modalStatsEl.innerHTML = `
          <div class="modal-row"><span>Langkah:</span><strong>${moves}</strong></div>
          <div class="modal-row"><span>Waktu:</span><strong>${formatTime(elapsedTime)}</strong></div>
          <div class="modal-row"><span>Bonus Waktu & Akurasi:</span><strong>+${roundTotal}</strong></div>
          <div class="modal-row"><span>Total Skor:</span><strong style="color:#00f2fe">${score}</strong></div>
          <div class="modal-row"><span>Skor Terbaik:</span><strong style="color:#f59e0b">${bestScore}</strong></div>
        `;

        modalBtnEl.textContent = isLastLevel ? 'Main Lagi Dari Awal' : 'Lanjut Level Berikutnya';
        modalEl.classList.add('active');
      }, 500);
    }

    modalBtnEl.addEventListener('click', () => {
      modalEl.classList.remove('active');
      if (currentLevelIndex >= LEVELS.length - 1) {
        initLevel(0, true);
      } else {
        initLevel(currentLevelIndex + 1, false);
      }
    });

    restartBtnEl.addEventListener('click', () => {
      initLevel(currentLevelIndex, false);
    });

    mainActionBtnEl.addEventListener('click', () => {
      initLevel(0, true);
    });

    soundBtnEl.addEventListener('click', () => {
      soundMuted = !soundMuted;
      soundBtnEl.textContent = soundMuted ? '🔇' : '🔊';
      soundBtnEl.title = soundMuted ? 'Nyalakan Suara' : 'Matikan Suara';
      if (!soundMuted && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'm' || e.key === 'M') {
        soundBtnEl.click();
      } else if (e.key === 'r' || e.key === 'R') {
        initLevel(currentLevelIndex, false);
      }
    });

    initLevel(0, true);
  </script>
</body>
</html>
