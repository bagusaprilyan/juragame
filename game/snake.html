<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyber Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1020;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .game-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00f5d4 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-level {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #00f5d4;
    }

    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .score-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #00f5d4, transparent);
      opacity: 0.7;
    }

    .score-card.best::before {
      background: linear-gradient(90deg, #8b5cf6, transparent);
    }

    .score-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      font-weight: 600;
    }

    .score-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 440px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.6), 0 0 24px -4px rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.25);
      background: #070a14;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 16, 32, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .overlay-title.game-over {
      color: #f43f5e;
      text-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
    }

    .overlay-title.start {
      background: linear-gradient(135deg, #00f5d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
      max-width: 280px;
    }

    .final-stats {
      margin-bottom: 24px;
      display: flex;
      gap: 16px;
    }

    .final-stat-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      background: linear-gradient(135deg, #00f5d4 0%, #06b6d4 100%);
      color: #0b1020;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px 36px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 245, 212, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.retry {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }

    .controls-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .dpad-btn {
      width: 56px;
      height: 50px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s, border-color 0.1s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .dpad-btn:active {
      background: rgba(0, 245, 212, 0.18);
      border-color: #00f5d4;
      transform: scale(0.93);
    }

    .dpad-up {
      grid-column: 2;
      grid-row: 1;
    }

    .dpad-left {
      grid-column: 1;
      grid-row: 2;
    }

    .dpad-down {
      grid-column: 2;
      grid-row: 2;
    }

    .dpad-right {
      grid-column: 3;
      grid-row: 2;
    }

    .hints {
      font-size: 0.75rem;
      color: #64748b;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) and (min-width: 640px) {
      .dpad {
        display: none;
      }
      .hints {
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <header>
      <div class="title-group">
        <h1>CYBER SNAKE</h1>
        <span class="badge-level" id="speedBadge">Kecepatan: Lv. 1</span>
      </div>
      <div class="header-actions">
        <button id="muteBtn" class="icon-btn" aria-label="Toggle Suara">🔊</button>
      </div>
    </header>

    <div class="scoreboard">
      <div class="score-card">
        <span class="score-label">Skor</span>
        <span class="score-value" id="currentScore">0</span>
      </div>
      <div class="score-card best">
        <span class="score-label">Terbaik</span>
        <span class="score-value" id="bestScore">0</span>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="overlay-title start">CYBER SNAKE</div>
        <p class="overlay-desc">Makan buah energi neon, hindari dinding dan tubuh sendiri. Kecepatan naik setiap 5 buah!</p>
        <button class="btn" id="startBtn">MULAI</button>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-title game-over">GAME OVER</div>
        <div class="final-stats">
          <div class="final-stat-box">
            <div class="score-label">Skor Akhir</div>
            <div class="score-value" id="finalScore">0</div>
          </div>
          <div class="final-stat-box">
            <div class="score-label">Terbaik</div>
            <div class="score-value" id="finalBest">0</div>
          </div>
        </div>
        <button class="btn retry" id="restartBtn">MAIN LAGI</button>
      </div>
    </div>

    <div class="controls-container">
      <div class="dpad">
        <button class="dpad-btn dpad-up" data-dir="UP">▲</button>
        <button class="dpad-btn dpad-left" data-dir="LEFT">◀</button>
        <button class="dpad-btn dpad-down" data-dir="DOWN">▼</button>
        <button class="dpad-btn dpad-right" data-dir="RIGHT">▶</button>
      </div>
      <div class="hints">
        <span>Desktop: WASD / Panah</span>
        <span>•</span>
        <span>Mobile: Tombol / Swipe</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('currentScore');
    const bestScoreEl = document.getElementById('bestScore');
    const speedBadgeEl = document.getElementById('speedBadge');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const finalScoreEl = document.getElementById('finalScore');
    const finalBestEl = document.getElementById('finalBest');
    const canvasContainer = document.getElementById('canvasContainer');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let direction = 'RIGHT';
    let inputQueue = [];
    let fruit = { x: 14, y: 10 };
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('cyber_snake_best') || '0', 10);
    let speedLevel = 1;
    let isPlaying = false;
    let isGameOver = false;
    let isMuted = localStorage.getItem('cyber_snake_muted') === 'true';
    let particles = [];
    let lastTime = 0;
    let moveTimer = 0;

    bestScoreEl.textContent = bestScore;
    updateMuteUI();

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        const ctxAudio = getAudioCtx();
        const now = ctxAudio.currentTime;
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();

        osc.connect(gain);
        gain.connect(ctxAudio.destination);

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.1);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'speed') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.setValueAtTime(720, now + 0.08);
          osc.frequency.setValueAtTime(960, now + 0.16);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'die') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.35);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'btn') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(380, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {}
    }

    function updateMuteUI() {
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    }

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      localStorage.setItem('cyber_snake_muted', isMuted);
      updateMuteUI();
      if (!isMuted) playSound('btn');
    });

    function getStepInterval() {
      return Math.max(65, 140 - (speedLevel - 1) * 9);
    }

    function resetGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = 'RIGHT';
      inputQueue = [];
      score = 0;
      speedLevel = 1;
      particles = [];
      currentScoreEl.textContent = '0';
      speedBadgeEl.textContent = 'Kecepatan: Lv. 1';
      spawnFruit();
      isGameOver = false;
      isPlaying = true;
      moveTimer = 0;
      lastTime = performance.now();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
    }

    function spawnFruit() {
      let valid = false;
      while (!valid) {
        fruit.x = Math.floor(Math.random() * TILE_COUNT);
        fruit.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === fruit.x && segment.y === fruit.y);
      }
    }

    function createExplosion(x, y, color) {
      const count = 10;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2.5 + 1;
        particles.push({
          x: (x + 0.5) * GRID_SIZE,
          y: (y + 0.5) * GRID_SIZE,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: Math.random() * 0.03 + 0.02,
          size: Math.random() * 3 + 2,
          color: color
        });
      }
    }

    function queueDirection(newDir) {
      const opposites = {
        UP: 'DOWN',
        DOWN: 'UP',
        LEFT: 'RIGHT',
        RIGHT: 'LEFT'
      };

      if (!isPlaying || isGameOver) return;

      const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
      if (newDir !== lastDir && newDir !== opposites[lastDir]) {
        if (inputQueue.length < 2) {
          inputQueue.push(newDir);
        }
      }
    }

    function update() {
      if (inputQueue.length > 0) {
        direction = inputQueue.shift();
      }

      const head = { ...snake[0] };
      if (direction === 'UP') head.y -= 1;
      else if (direction === 'DOWN') head.y += 1;
      else if (direction === 'LEFT') head.x -= 1;
      else if (direction === 'RIGHT') head.x += 1;

      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        triggerGameOver();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          triggerGameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === fruit.x && head.y === fruit.y) {
        score++;
        currentScoreEl.textContent = score;

        createExplosion(fruit.x, fruit.y, '#00f5d4');

        if (score % 5 === 0) {
          speedLevel++;
          speedBadgeEl.textContent = `Kecepatan: Lv. ${speedLevel}`;
          playSound('speed');
        } else {
          playSound('eat');
        }

        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = bestScore;
          localStorage.setItem('cyber_snake_best', bestScore);
        }

        spawnFruit();
      } else {
        snake.pop();
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      isPlaying = false;
      playSound('die');

      createExplosion(snake[0].x, snake[0].y, '#f43f5e');

      finalScoreEl.textContent = score;
      finalBestEl.textContent = bestScore;
      gameOverOverlay.classList.remove('hidden');
    }

    function render(time) {
      ctx.fillStyle = '#070a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      if (isPlaying || isGameOver) {
        const pulse = Math.sin(time / 160) * 2;
        const fruitCenterX = fruit.x * GRID_SIZE + GRID_SIZE / 2;
        const fruitCenterY = fruit.y * GRID_SIZE + GRID_SIZE / 2;
        const fruitRadius = Math.max(2, GRID_SIZE / 2.3 + pulse);

        const glow = ctx.createRadialGradient(
          fruitCenterX, fruitCenterY, 2,
          fruitCenterX, fruitCenterY, GRID_SIZE * 1.2
        );
        glow.addColorStop(0, 'rgba(0, 245, 212, 0.4)');
        glow.addColorStop(1, 'rgba(0, 245, 212, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(fruitCenterX, fruitCenterY, GRID_SIZE * 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#00f5d4';
        ctx.beginPath();
        ctx.arc(fruitCenterX, fruitCenterY, fruitRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fruitCenterX - fruitRadius * 0.3, fruitCenterY - fruitRadius * 0.3, fruitRadius * 0.28, 0, Math.PI * 2);
        ctx.fill();

        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          const px = seg.x * GRID_SIZE;
          const py = seg.y * GRID_SIZE;
          const t = i / Math.max(snake.length, 1);

          const r = Math.round(0 + t * 139);
          const g = Math.round(245 - t * (245 - 92));
          const b = Math.round(212 + t * (246 - 212));
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

          const pad = i === 0 ? 1 : 2;
          const cornerRadius = i === 0 ? 6 : 4;
          drawRoundedRect(ctx, px + pad, py + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2, cornerRadius);
          ctx.fill();

          if (i === 0) {
            ctx.fillStyle = '#0b1020';
            let eye1X, eye1Y, eye2X, eye2Y;
            const eyeOffset = 5;
            const eyeForward = 13;

            if (direction === 'RIGHT') {
              eye1X = px + eyeForward; eye1Y = py + eyeOffset;
              eye2X = px + eyeForward; eye2Y = py + GRID_SIZE - eyeOffset;
            } else if (direction === 'LEFT') {
              eye1X = px + (GRID_SIZE - eyeForward); eye1Y = py + eyeOffset;
              eye2X = px + (GRID_SIZE - eyeForward); eye2Y = py + GRID_SIZE - eyeOffset;
            } else if (direction === 'UP') {
              eye1X = px + eyeOffset; eye1Y = py + (GRID_SIZE - eyeForward);
              eye2X = px + GRID_SIZE - eyeOffset; eye2Y = py + (GRID_SIZE - eyeForward);
            } else {
              eye1X = px + eyeOffset; eye1Y = py + eyeForward;
              eye2X = px + GRID_SIZE - eyeOffset; eye2Y = py + eyeForward;
            }

            ctx.beginPath();
            ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
            ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }

    function drawRoundedRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.lineTo(x + width - radius, y);
      context.quadraticCurveTo(x + width, y, x + width, y + radius);
      context.lineTo(x + width, y + height - radius);
      context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      context.lineTo(x + radius, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - radius);
      context.lineTo(x, y + radius);
      context.quadraticCurveTo(x, y, x + radius, y);
      context.closePath();
    }

    function gameLoop(time) {
      if (!lastTime) lastTime = time;
      const delta = time - lastTime;
      lastTime = time;

      if (isPlaying && !isGameOver) {
        moveTimer += delta;
        if (moveTimer >= getStepInterval()) {
          update();
          moveTimer = 0;
        }
      }

      render(time);
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (['ArrowUp', 'KeyW'].includes(key)) {
        queueDirection('UP');
        e.preventDefault();
      } else if (['ArrowDown', 'KeyS'].includes(key)) {
        queueDirection('DOWN');
        e.preventDefault();
      } else if (['ArrowLeft', 'KeyA'].includes(key)) {
        queueDirection('LEFT');
        e.preventDefault();
      } else if (['ArrowRight', 'KeyD'].includes(key)) {
        queueDirection('RIGHT');
        e.preventDefault();
      } else if ((key === ' ' || key === 'Enter') && (!isPlaying || isGameOver)) {
        playSound('btn');
        resetGame();
        e.preventDefault();
      }
    });

    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const handlePress = (e) => {
        e.preventDefault();
        const dir = btn.getAttribute('data-dir');
        queueDirection(dir);
      };
      btn.addEventListener('touchstart', handlePress, { passive: false });
      btn.addEventListener('mousedown', handlePress);
    });

    let touchStartX = 0;
    let touchStartY = 0;

    canvasContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    canvasContainer.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (Math.max(absDx, absDy) > 24) {
        if (absDx > absDy) {
          queueDirection(dx > 0 ? 'RIGHT' : 'LEFT');
        } else {
          queueDirection(dy > 0 ? 'DOWN' : 'UP');
        }
      }
    }, { passive: true });

    startBtn.addEventListener('click', () => {
      playSound('btn');
      resetGame();
    });

    restartBtn.addEventListener('click', () => {
      playSound('btn');
      resetGame();
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
